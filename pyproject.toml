[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-trend-predictor"
version = "1.0.0"
description = "Predict which trending YouTube videos last, detect rising topics, and auto-cut a vertical video."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Muhammad Shahmeer"}]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3",
  "pillow>=10.0", "moviepy>=2.0", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
trendpredictor = "trendpredictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
